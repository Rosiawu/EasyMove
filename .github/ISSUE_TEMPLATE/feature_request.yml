name: 功能建议
description: 提议一种更好的文件管理体验
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 请先描述使用场景和痛点，不要只写解决方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的解决方式
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方法
  - type: dropdown
    id: platform
    attributes:
      label: 主要平台
      options:
        - macOS
        - Windows
        - 两个平台
    validations:
      required: true
