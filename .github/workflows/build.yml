name: Build installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS Apple Silicon DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: EasyMove-macOS-arm64
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
          if-no-files-found: error

  windows:
    name: Windows x64 installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: EasyMove-Windows-x64
          path: |
            dist/*.exe
            dist/*.exe.blockmap
          if-no-files-found: error
